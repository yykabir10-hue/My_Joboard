# Daily headless scrape + email digest, running unattended in the cloud so it
# does not depend on this Mac being awake. Mirrors tools/daily_run.sh (the
# local/cron equivalent) but adapted for an ephemeral runner:
#   - No .env / flock - credentials come from repo secrets, and GitHub Actions
#     already serializes same-named concurrency groups instead of a lockfile.
#   - job_scraper/seen_jobs.json and job_scraper/pools/ are gitignored on
#     purpose (see .gitignore's top comment and tools/security_guards.py,
#     which fails a change that loosens that rule) - so state is round-tripped
#     through actions/cache instead of committed to the repo.
#
# Runs all 5 installed portals, INCLUDING xing-search and linkedin-search.
# Both are personal-use-only per their own ToS (see their SKILL.md files and
# this repo's ci.yml, which avoids live-testing them from a shared runner for
# that exact reason) - the user was told this explicitly and chose to include
# them anyway, since they were the highest-yield sources for this search. See
# job_scraper/search-profiles.json's _comment for the full rationale.

name: Daily Werkstudent Digest

on:
  schedule:
    # 05:30 UTC = 07:30 CEST (summer) / 06:30 CET (winter) - a morning digest
    # year-round without chasing DST.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and render the digest without sending mail'
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare state directories
        run: mkdir -p job_scraper/pools job_scraper/logs

      - name: Restore scrape state (seen_jobs.json + pools)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            job_scraper/seen_jobs.json
            job_scraper/pools
          key: scrape-state-${{ github.run_id }}
          restore-keys: |
            scrape-state-

      - name: Compute today's date (UTC)
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Scrape all portals
        run: |
          python3 tools/run_scrape.py \
            --out "job_scraper/pools/${{ steps.date.outputs.date }}.json" \
            --update-seen \
            --timeout 120

      - name: Send digest email
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          JOBSEARCH_SMTP_HOST: ${{ secrets.JOBSEARCH_SMTP_HOST }}
          JOBSEARCH_SMTP_PORT: ${{ secrets.JOBSEARCH_SMTP_PORT }}
          JOBSEARCH_SMTP_USER: ${{ secrets.JOBSEARCH_SMTP_USER }}
          JOBSEARCH_SMTP_PASSWORD: ${{ secrets.JOBSEARCH_SMTP_PASSWORD }}
          JOBSEARCH_DIGEST_TO: ${{ secrets.JOBSEARCH_DIGEST_TO }}
        run: python3 tools/send_digest.py "job_scraper/pools/${{ steps.date.outputs.date }}.json"

      - name: Render digest preview only (dry run - nothing sent)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python3 tools/send_digest.py \
            "job_scraper/pools/${{ steps.date.outputs.date }}.json" \
            --html-out "job_scraper/logs/${{ steps.date.outputs.date }}.html"

      - name: Upload digest preview artifact (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-preview-${{ steps.date.outputs.date }}
          path: job_scraper/logs/*.html
          retention-days: 7

      - name: Prune pools older than 30 days (before the cache is saved back)
        if: always()
        run: find job_scraper/pools -name '*.json' -mtime +30 -delete || true
